<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos Entregues</title>

  <link rel="stylesheet" href="../assets/css/styleADM.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
   <link rel="icon" type="image/png" href="../public/icons/LogoBellaMessa.png" />
  <title>Pedidos entregues Bella Massa</title>
  <style>
    #total-dia,
    #total-mes {
      font-weight: bold;
      color: green;
    }

    .pedido {
      background-color: #f8f9fa;
      border-radius: 10px;
      margin-bottom: 1rem;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pedido:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .valor-pedido {
      font-weight: bold;
      color: #28a745;
    }

    .data-pedido {
      color: #6c757d;
      font-size: 0.9rem;
    }

    .totais-container {
      background-color: #343a40;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      color: white;
    }
  </style>
</head>

<body class="backgrond-black">
  <!-- NAVBAR -->
  <header class="header-adm">
    <nav class="nav-adm navbar navbar-lg bg-body-tertiary-dark navbar-dark">
      <div class="container-fluid d-flex align-items-center">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="../AdmPages/homeADM.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/EdicaoPizzasADM.html">Editar cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/utlimospedidosAdm.html">Pedidos recebidos</a></li>
            <li class="nav-item"><a class="nav-link active" href="../AdmPages/PedidosEntregueAdm.html">Pedidos finalizados</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/AvaliacaoAdm.html">Avaliação</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/CadastrarProdutos.html">Cadastrar produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/respostaContato.html">Responder contato</a></li>
            <li class="nav-item"><a class="nav-link" href="../AdmPages/ClientesCadastradosAdm.html">Clientes cadastrados</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="body-pedidos container">
    <h3 class="mt-4 mb-4">Pedidos Entregues</h3>
    
    <div class="totais-container">
      <div class="row">
        <div class="col-md-6">
          <h4>Total do dia: <span id="total-dia">0,00</span></h4>
        </div>
        <div class="col-md-6">
          <h4>Total do mês: <span id="total-mes">0,00</span></h4>
        </div>
      </div>
    </div>

    <div id="lista-pedidos"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const listaPedidosDiv = document.getElementById("lista-pedidos");
      const pedidosEntregues = JSON.parse(localStorage.getItem("pedidosEntregues")) || [];
      
      // Verifica se há relatório salvo
      const relatorio = JSON.parse(localStorage.getItem('relatorioDiario')) || {
        totalDiario: 0,
        totalMensal: 0
      };

      // Atualiza os totais na tela
      document.getElementById("total-dia").textContent = relatorio.totalDiario.toFixed(2).replace(".", ",");
      document.getElementById("total-mes").textContent = relatorio.totalMensal.toFixed(2).replace(".", ",");

      if (pedidosEntregues.length === 0) {
        listaPedidosDiv.innerHTML = `
          <div class="alert alert-info">
            Nenhum pedido entregue ainda.
          </div>
        `;
        return;
      }

      // Ordena por data mais recente primeiro
      pedidosEntregues.sort((a, b) => {
        return new Date(b.dataEntrega || b.data) - new Date(a.dataEntrega || a.data);
      });

      pedidosEntregues.forEach((pedido) => {
        const dataPedido = new Date(pedido.dataEntrega || pedido.data);
        const dataFormatada = dataPedido.toLocaleDateString('pt-BR');
        const horaFormatada = dataPedido.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        const div = document.createElement("div");
        div.classList.add("pedido");
        div.innerHTML = `
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5>Pedido #${pedido.id}</h5>
              <p><strong>Cliente:</strong> ${pedido.cliente.nome}</p>
              <p><strong>Endereço:</strong> ${pedido.cliente.endereco}</p>
            </div>
            <div class="text-end">
              <span class="valor-pedido">R$ ${pedido.valorTotal.toFixed(2).replace('.', ',')}</span>
              <p class="data-pedido mb-0">${dataFormatada} às ${horaFormatada}</p>
            </div>
          </div>
        `;
        
        div.addEventListener('click', () => {
          localStorage.setItem('pedidoSelecionado', pedido.id);
          window.location.href = 'detalhes-pedido.html';
        });

        listaPedidosDiv.appendChild(div);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
