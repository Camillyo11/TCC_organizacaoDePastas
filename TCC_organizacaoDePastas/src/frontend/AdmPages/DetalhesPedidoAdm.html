<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Pedido</title>
  <link rel="stylesheet" href="../assets/css/styleADM.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="backgrond-black">

  <!-- NAVBAR -->
  <header class="header-adm">
    <nav class="nav-adm navbar navbar-lg bg-body-tertiary-dark navbar-dark">
      <div class="container-fluid d-flex align-items-center ">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="ultimospedidosAdm.html">Últimos Pedidos</a></li>
            <li class="nav-item"><a class="nav-link" href="pedidosEntregues.html">Pedidos Entregues</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="Body-detalhes-pedido">
    <div class="pedido-info">
      <p><strong>Código:</strong> <span id="codigoPedido"></span></p>
      <p><strong>Nome:</strong> <span id="nomePedido"></span></p>
      <p><strong>Telefone:</strong> <span id="telefonePedido"></span></p>
    </div>

    <hr>

    <div class="pedido-info">
      <p><strong>Data do Pedido:</strong> <span id="dataPedido"></span></p>
      <p><strong>Status Atual:</strong> <span id="statusAtual"></span></p>
    </div>

    <hr>

    <div class="pedido-info">
      <h2>Endereço de Entrega</h2>
      <p><strong>Endereço:</strong> <span id="enderecoPedido"></span></p>
    </div>

    <hr>

    <div class="itens-pedido">
      <h2>ITENS DO PEDIDO</h2>
      <div id="listaItens"></div>
    </div>

    <h1>VALOR TOTAL: <span id="valorTotal"></span></h1>

    <div class="status-pedido">
      <h2>ATUALIZAR STATUS</h2>
      <div class="button-status">
        <button class="button-atualiza">Pedido Confirmado</button>
        <button class="button-atualiza">Pedido em preparo</button>
        <button class="button-atualiza">Saiu para entrega</button>
        <button class="entregue-button">Entregue</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // Recupera o ID do pedido selecionado
    const pedidoId = localStorage.getItem('pedidoSelecionado');
    const pedidosPendentes = JSON.parse(localStorage.getItem('pedidosPendentes')) || [];
    const pedidosEntregues = JSON.parse(localStorage.getItem('pedidosEntregues')) || [];
    
    // Procura o pedido em ambas as listas
    let pedido = pedidosPendentes.find(p => p.id == pedidoId) || 
                 pedidosEntregues.find(p => p.id == pedidoId);

    if (!pedido) {
      alert("Pedido não encontrado.");
      window.location.href = "ultimospedidosAdm.html";
    }

    // Preenche os dados do pedido
    document.getElementById("codigoPedido").textContent = pedido.id;
    document.getElementById("nomePedido").textContent = pedido.cliente.nome;
    document.getElementById("telefonePedido").textContent = pedido.cliente.telefone || 'Não informado';
    document.getElementById("dataPedido").textContent = new Date(pedido.data).toLocaleString();
    document.getElementById("statusAtual").textContent = getStatusText(pedido.status);
    document.getElementById("enderecoPedido").textContent = pedido.cliente.endereco;
    document.getElementById("valorTotal").textContent = `R$ ${pedido.valorTotal.toFixed(2).replace('.', ',')}`;

    // Preenche os itens do pedido
    const listaItens = document.getElementById("listaItens");
    pedido.itens.forEach(item => {
      const itemDiv = document.createElement("div");
      itemDiv.className = "item-pedido mb-3 p-3 bg-dark rounded";
      
      itemDiv.innerHTML = `
        <p><strong>${item.nome}</strong></p>
        ${item.bebidas ? `<p>Bebidas: ${item.bebidas}</p>` : ''}
        <p>Valor: R$ ${item.preco.toFixed(2).replace('.', ',')}</p>
      `;
      listaItens.appendChild(itemDiv);
    });

    // Mapeamento de status
    const statusMap = {
      "Pedido Confirmado": "confirmado",
      "Pedido em preparo": "preparo",
      "Saiu para entrega": "entrega",
      "Entregue": "entregue"
    };

    // Função para converter status para texto
    function getStatusText(status) {
      const map = {
        "pendente": "Pendente",
        "confirmado": "Confirmado",
        "preparo": "Em preparo",
        "entrega": "Saiu para entrega",
        "entregue": "Entregue"
      };
      return map[status] || "Desconhecido";
    }

    // Adiciona eventos aos botões de status
    document.querySelectorAll('.button-atualiza, .entregue-button').forEach(botao => {
      botao.addEventListener('click', () => {
        const novoStatus = statusMap[botao.innerText];
        
        // Atualiza o status do pedido
        pedido.status = novoStatus;
        
        if (novoStatus === "entregue") {
          // Move para pedidos entregues
          const novosPendentes = pedidosPendentes.filter(p => p.id != pedidoId);
          localStorage.setItem('pedidosPendentes', JSON.stringify(novosPendentes));
          
          // Adiciona data de entrega
          pedido.dataEntrega = new Date().toISOString();
          
          // Adiciona aos entregues (se já não estiver)
          if (!pedidosEntregues.some(p => p.id == pedidoId)) {
            pedidosEntregues.unshift(pedido);
            localStorage.setItem('pedidosEntregues', JSON.stringify(pedidosEntregues));
          }
          
          // Atualiza relatório financeiro
          atualizarRelatorio(pedido.valorTotal);
        } else {
          // Atualiza nos pendentes (se não estiver entregue)
          const index = pedidosPendentes.findIndex(p => p.id == pedidoId);
          if (index !== -1) {
            pedidosPendentes[index] = pedido;
            localStorage.setItem('pedidosPendentes', JSON.stringify(pedidosPendentes));
          }
        }
        
        alert(`Status atualizado para: ${botao.innerText}`);
        document.getElementById("statusAtual").textContent = getStatusText(novoStatus);
        
        // Se foi marcado como entregue, volta para a lista de pedidos
        if (novoStatus === "entregue") {
          setTimeout(() => {
            window.location.href = "ultimospedidosAdm.html";
          }, 1500);
        }
      });
    });

    function atualizarRelatorio(valor) {
      const hoje = new Date().toLocaleDateString();
      const relatorio = JSON.parse(localStorage.getItem('relatorioDiario')) || { 
        data: hoje, 
        totalDiario: 0, 
        totalMensal: 0 
      };

      // Se for outro dia, reinicia o diário
      if (relatorio.data !== hoje) {
        relatorio.data = hoje;
        relatorio.totalDiario = 0;
      }

      relatorio.totalDiario += valor;
      relatorio.totalMensal += valor;
      localStorage.setItem('relatorioDiario', JSON.stringify(relatorio));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
