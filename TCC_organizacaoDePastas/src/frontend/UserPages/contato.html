<head>

  <!-- EmailJS (SDK atualizada) -->

    // Inicialização mais segura
    emailjs.init({
      publicKey: '_NRN00duSS7ZqpqjA',

  <title>Área de contato</title>

<body class="backgrond-black">
  <div id="header-container"></div>

  <!-- Banner de contato -->
  <section class="contato-banner hero container-fluid text-white">
    <div class="container-titulo-contato">
      <h1 class="contato-titulo fw-bold">CONTATO</h1>
    </div>
  </section>

  <!-- Formulário -->
  <div class="container-contato container p-3">
    <form class="form-contato" id="contactForm">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>
      <div class="form-group">
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>
      <div class="form-group">
        <label for="assunto" class="form-label">Assunto:</label>
        <input type="text" class="form-control" id="assunto" name="assunto" placeholder="Digite o assunto" required>
      </div>
      <div class="form-group">
        <label for="mensagem" class="form-label">Mensagem:</label>
        <textarea class="form-control" id="mensagem" name="mensagem" rows="4" placeholder="Digite sua mensagem" required></textarea>
      </div>
      <div class="center-button">
        <button type="submit" class="button-black">Enviar</button>
      </div>
      <div id="form-message" class="mt-3 text-white text-center"></div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer-conteiner">
    <div class="container text-center">
      <div class="row">
        <div class="col">
          <img class="logo-grande" src="../public/icons/LogoBellaMessa.png" alt="Logo da Bella Massa">
        </div>
        <div class="col">
          <h5>Endereço</h5>
          <p>Av João Gonçalves dos Reis, 350, Medeiros(Esquina com a Av Francisco Nobre)</p>
          <p>São Paulo-SP</p>
        </div>
        <div class="col">
          <h5>Telefone</h5>
          <p>(11)9002-0922</p>
          <p>(11)9002-0922</p>
        </div>
        <div class="col">
          <h5>Horário de funcionamento</h5>
          <h6>Terça a Quinta</h6>
          <p> Das 17:00 ás 00:00</p>
          <h6>Sexta á Sábado</h6>
          <p> Das 17:00 ás 01:00</p>
        </div>
      </div>

      <div class="row">
        <div class="col redes-sociais">
          <a href="#" class="midia"><img src="../public/icons/whatsapp.png" height="30" width="30"></a>
          <a href="#" class="midia"><img src="../public/icons/instagram.png" height="30" width="30"></a>
          <a href="#" class="midia"><img src="../public/icons/tik-tok (1).png" height="30" width="30"></a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Configuração do EmailJS (ATUALIZADA)
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const messageDiv = document.getElementById('form-message');
      messageDiv.textContent = 'Enviando mensagem...';
      messageDiv.style.color = '#fff';
      messageDiv.style.display = 'block';

      emailjs.sendForm(
        'service_5sj6bzb',      // Service ID
        'template_m1jw6fx',     // Template ID corrigido
        this                    // Formulário HTML
      )
      .then(() => {
        messageDiv.textContent = '✔ Mensagem enviada com sucesso para randomprak7@gmail.com!';
        messageDiv.style.color = '#4CAF50';
        this.reset();
        
        setTimeout(() => {
          messageDiv.style.display = 'none';
        }, 5000);
      })
      .catch((error) => {
        messageDiv.textContent = '✖ Erro ao enviar: ' + error.text;
        messageDiv.style.color = '#F44336';
        console.error("Erro detalhado:", error);
      });
    });


  </script>

form.addEventListener("submit", function (e) {
